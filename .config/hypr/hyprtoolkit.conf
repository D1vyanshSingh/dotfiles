# hyprtoolkit palette — matched to the 43PR quickshell theme
# (Theme.qml + ~/.cache/43pr/quickshell-theme.json).
#
# Hyprtoolkit apps read this, notably hyprpolkitagent's authentication
# dialog, which otherwise ships Hyprtoolkit's defaults (near-black
# #181818 surfaces, bright cyan #00FFCC accent, sans-serif).
#
# Colors are 0xAARRGGBB, same syntax as Hyprland. Fully opaque on purpose:
# a translucent prompt over a bright window is unreadable.

background       = 0xFF0e0e0f   # Theme.bg      — window field
base             = 0xFF131315   # Theme.bgPanel — dialog surface
alternate_base   = 0xFF1c1b1d   # Theme.bgCard  — raised elements, password field
text             = 0xFFe5e1e3   # Theme.text
bright_text      = 0xFFe5e1e3   # palette is monochrome; no brighter tier to use
accent           = 0xFFc6c5d6   # Theme.accent   — focus ring / primary button
accent_secondary = 0xFFc7c5d0   # Theme.accent2

# Theme.fontFamily says "JetBrains Mono", but that family isn't installed —
# the Nerd Font build renames it, so that name falls back to Noto Sans Mono.
# Use the installed name to actually get the intended typeface.
font_family           = JetBrainsMono Nerd Font Mono
font_family_monospace = JetBrainsMono Nerd Font Mono

# Matches the sizes the settings window uses (page title 19, section 15,
# subhead 13, body 12, caption 10).
h1_size         = 19
h2_size         = 15
h3_size         = 13
font_size       = 12
small_font_size = 10

rounding_large  = 10    # Theme.radius
rounding_small  = 6
